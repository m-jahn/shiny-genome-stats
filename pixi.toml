[workspace]
authors = ["m-jahn <jahn@mpusp.mpg.de>"]
channels = ["conda-forge", "bioconda"]
name = "shiny-genome-stats"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = { cmd = "R -e \"shiny::runApp('.')\"", default-environment = "shiny" }

[environments]
shiny = ["rbase"]

[feature.rbase.dependencies]
r-tidyverse = ">=2.0.0,<3"
r-shiny = ">=1.14.0,<2"
r-httr = ">=1.4.9,<2"
r-jsonlite = ">=2.0.0,<3"
r-dt = ">=0.34.0,<0.35"
r-shinywidgets = ">=0.9.1,<0.10"
r-shinythemes = ">=1.2.0,<2"
r-shinytree = ">=0.3.1,<0.4"
r-configr = ">=0.3.5,<0.4"
r-rentrez = ">=1.2.4,<2"
bioconductor-keggrest = ">=1.50.0,<2"

